<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acesso · WellPro</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <main class="login">
    <section class="apresentacao">
      <a class="marca" href="painel.html">WellPro<span>.</span></a>
      <h1>Controle de chaves</h1>
      <p>Organize as retiradas e devoluções das chaves da sua organização.</p>
    </section>
    <section class="acesso"><div>
      <h2>Acesse sua conta</h2>
      <p class="descricao">Modelo visual da tela de acesso.</p>
      <form>
        <label>Usuário ou matrícula<input type="text" name="usuario" placeholder="Seu usuário" autocomplete="username"></label>
        <label>Senha<input type="password" name="senha" placeholder="Sua senha" autocomplete="current-password"></label>
        <button type="button" disabled>Entrar</button>
      </form>
      <p class="aviso">Esta etapa não possui autenticação. Os campos são apenas ilustrativos.</p>
      <a class="link" href="painel.html">Visualizar as telas do protótipo →</a>
    </div></section>
  </main>
</body>
</html>
