<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Usuários · WellPro</title>
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>
  <body>
    <aside class="menu">
      <a class="marca" href="painel.html" aria-label="WellPro — Visão geral"
        >WellPro<span>.</span></a
      >
      <nav aria-label="Menu principal">
        <a href="painel.html">Visão geral</a>
        <a href="chaves.html">Chaves</a>
        <a href="retirada.html">Registrar retirada</a>
        <a href="devolucao.html">Registrar devolução</a>
        <a href="historico.html">Histórico</a>
        <a href="organizacao.html">Organização</a>
        <a href="usuarios.html" class="ativo" aria-current="page" data-admin hidden>Usuários</a>
      </nav>
      <div class="instituicao">
        <img data-organizacao-imagem class="logo-organizacao" alt="Organização" hidden />
        <strong data-organizacao-nome>Sua organização</strong>
        <small data-organizacao-unidade>Gestão de ambientes</small>
        <a id="sair" href="index.html">Sair</a>
      </div>
    </aside>
    <main class="conteudo">
      <header class="cabecalho">
        <div>
          <h1>Usuários</h1>
          <p class="descricao">Cadastre, edite e desative usuários.</p>
        </div>
      </header>
      <p id="mensagem" class="aviso" role="status" aria-live="polite" hidden></p>
      <section class="painel">
        <h2 id="modo-usuario">Novo usuário</h2>
        <form id="form-usuario">
          <label>Nome<input name="nome" required maxlength="120" /></label>
          <label>Login<input name="login" required minlength="3" maxlength="60" /></label>
          <label
            >Senha (em edição, vazia mantém a atual)<input
              name="senha"
              type="password"
              required
              minlength="8"
              maxlength="128"
              autocomplete="new-password"
          /></label>
          <label
            >Perfil<select name="perfil">
              <option value="administrador">Administrador</option>
              <option value="operador">Operador</option>
            </select></label
          >
          <label><input type="checkbox" name="ativo" checked /> Ativo</label>
          <div class="acoes">
            <button type="submit">Salvar usuário</button
            ><button type="button" id="cancelar">Novo / cancelar edição</button>
          </div>
        </form>
      </section>
      <section class="painel">
        <div class="tabela">
          <table>
            <thead>
              <tr>
                <th>Nome</th>
                <th>Login</th>
                <th>Perfil</th>
                <th>Situação</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td colspan="5">Carregando registros…</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
      <footer>WellPro · Sistema de controle de chaves</footer>
    </main>
    <script type="module" src="../assets/js/usuarios.js"></script>
    <script type="module" src="../assets/js/modules/autenticacao.js"></script>
    <noscript>Ative o JavaScript do navegador para usar o WellPro.</noscript>
  </body>
</html>
